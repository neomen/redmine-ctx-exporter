<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redmine Context Exporter — Settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 620px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
  button { padding: 8px 16px; margin: 12px 8px 0 0; cursor: pointer; }
  .hint { color: #666; font-size: 12px; margin-top: 4px; }
  .status { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
  .status.ok { background: #e8f5e9; color: #1b5e20; display: block; }
  .status.err { background: #ffebee; color: #b71c1c; display: block; }
</style>
</head>
<body>
  <h1>Redmine Context Exporter</h1>

  <label>Redmine URL</label>
  <input id="baseUrl" placeholder="https://projects.nadostudio.com">
  <div class="hint">Без завершающего слеша, без /issues.</div>

  <label>API key</label>
  <input id="apiKey" type="password" placeholder="…">
  <div class="hint">Redmine → My account → API access key → Show.</div>

  <button id="save">Save</button>
  <button id="test">Test connection</button>

  <div id="status" class="status"></div>

  <script src="options.js" type="module"></script>
</body>
</html>
